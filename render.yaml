# Render blueprint for the Registrar.
#
# One web service runs both halves: the read-only HTTP API that the registry
# front end reads, and the payroll loop that pays people once a minute.
#
# The books live in Neon Postgres, not on this instance. That change removed
# the failure that previously made a free instance unusable: the database no
# longer dies with the container, so a deploy, a restart, or a sleep/wake no
# longer resets every company to Q0 and every employee's seniority to 1x, and
# no longer strands a treasury by losing the salt that derives its key.
#
# What the free plan still costs you: the instance sleeps when idle, so payroll
# pauses. The schedule is driven by completed runs, so it freezes and resumes
# rather than fast-forwarding -- nobody is paid while it sleeps, but nothing is
# miscounted. The first request after a sleep also waits on a cold start.
#
# Move to `plan: starter` when you want payroll to actually run every minute.
# No disk is needed at any plan: the data is in Neon.

services:
  - type: web
    name: incorporate-registrar
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node src/registrar.js
    healthCheckPath: /api/protocol

    envVars:
      # Neon Postgres. Pooled connection string, set in the dashboard.
      # sync:false keeps the credentials out of this file and out of git --
      # this repository is public.
      - key: DATABASE_URL
        sync: false

      - key: NODE_VERSION
        value: "24"

      - key: RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com

      # Which origins may read the API. Narrowed to the registry front end
      # rather than left open.
      - key: ALLOWED_ORIGINS
        value: https://incorporate-gules.vercel.app

      # LIVE. Payroll sends real transfers.
      #
      # Safe to run live only because the books are durable: a restart no
      # longer rewrites the figures a payment is computed from, and no longer
      # loses the salt that derives a treasury's key.
      #
      # Two things still bound the blast radius. A run with no companies pays
      # nobody, and the Registrar can only spend from treasuries it derives
      # from KEEPER_MNEMONIC -- it cannot touch any other wallet.
      - key: KEEPER_EXECUTE
        value: "1"

      # The mnemonic that derives EVERY company treasury. Dashboard only.
      # Without it the Registrar still serves the API and still runs the loop,
      # but cannot derive a treasury, so nothing can move and no company can
      # be filed.
      - key: KEEPER_MNEMONIC
        sync: false

      # Pins company logos to IPFS. Without it the filing form asks for a URL
      # instead of accepting a file.
      - key: PINATA_JWT
        sync: false

      # $INC is not issued yet. Leave both unset and the 1% simply accrues,
      # fully accounted and excluded from payroll, buying nothing.
      - key: PLATFORM_TOKEN
        sync: false
      - key: PLATFORM_CURVE
        sync: false
