# Render blueprint for the Registrar.
#
# One web service runs both halves: the read-only HTTP API the registry front
# end reads, and the payroll loop that pays people once a minute.
#
# TWO SETTINGS HERE ARE LOAD-BEARING, NOT PREFERENCES:
#
#   1. plan: starter (not free). A free instance sleeps after inactivity, and a
#      sleeping Registrar runs no payroll. The schedule would freeze and resume
#      later — the design survives that, but nobody gets paid meanwhile.
#
#   2. disk. A company's age is its number of payroll runs, and that count lives
#      in SQLite. Without a persistent disk, every deploy or restart wipes the
#      database: every company snaps back to Q0 and its 8% opening rate, and
#      every employee's seniority resets from 4x to 1x. That is not a cosmetic
#      reset — it rewrites what people are owed.

services:
  - type: web
    name: incorporate-registrar
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node src/registrar.js
    healthCheckPath: /api/protocol

    disk:
      name: registry-books
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # SQLite lives on the persistent disk, never in the ephemeral filesystem.
      - key: DB_PATH
        value: /var/data/incorporate.db

      - key: NODE_VERSION
        value: "24"

      - key: RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com

      # Which origins may read the API. Narrow this to the registry front end
      # rather than leaving it open, now that you know the front end's URL.
      - key: ALLOWED_ORIGINS
        value: https://incorporate-gules.vercel.app

      # LIVE. Payroll sends real transfers.
      #
      # This is inert until the first company is filed -- a run with no
      # companies pays nobody -- so the risk begins the moment you file, not
      # the moment you deploy. The Registrar still cannot move a treasury it
      # cannot derive, so nothing moves at all until KEEPER_MNEMONIC is set.
      - key: KEEPER_EXECUTE
        value: "1"

      # The mnemonic that derives EVERY company treasury. Set it in the Render
      # dashboard only. sync:false keeps it out of this file and out of git.
      - key: KEEPER_MNEMONIC
        sync: false

      # $INC is not issued yet. Leave both unset and the 1% simply accrues,
      # fully accounted and excluded from payroll, buying nothing.
      - key: PLATFORM_TOKEN
        sync: false
      - key: PLATFORM_CURVE
        sync: false
